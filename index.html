  .border-r { border-right-width: 1px; border-right-style: solid; } .border-t { border-top-width: 1px; border-top-style: solid; }
  .h-full { height: 100%; } .outline-none { outline: none; }
  .font-normal { font-weight: 400; }
  .mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; }
  .py-0\.5 { padding-top: 2px; padding-bottom: 2px; }
  .shadow-xl { box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
  .transition-colors { transition: background-color .15s, color .15s, border-color .15s; }
  .hidden { display: none; } .block { display: block; }
  button { font-family: inherit; border: none; cursor: pointer; }
  input, select { font-family: inherit; }

  /* ---- design system colors/sizes ---- */
  .bg-app { background: #14171C; }
  .bg-panel { background: #1B2028; }
  .bg-sidebar { background: #171B22; }
  .border-default { border-color: #2A303B; }
  .border-subtle { border-color: #22262E; }
  .border-accent { border-color: #E8A33D; }
  .text-heading { color: #F4F1EA; }
  .text-body { color: #CDD2DB; }
  .text-muted { color: #8890A0; }
  .text-faint { color: #5A6270; }
  .text-positive { color: #6FAE8C; }
  .text-negative { color: #D9694B; }
  .text-accent { color: #E8A33D; }
  .text-10 { font-size: 10px; }
  .text-11 { font-size: 11px; }
  .max-h-panel-lg { max-height: 600px; }
  .max-h-panel-sm { max-height: 520px; }
  .hover-row:hover { background: #20262F; }
  .search-input::placeholder { color: #5A6270; }
  .search-input:focus { border-color: #E8A33D; }

  /* ============================= MOBILE RESPONSIVE ============================= */
  @media (max-width: 768px) {
    .app-shell { flex-direction: column; }

    /* Sidebar becomes a fixed bottom tab bar */
    .app-sidebar {
      order: 2;
      width: 100%;
      flex-direction: row;
      align-items: stretch;
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
      border-right: none;
      border-top: 1px solid #2A303B;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      height: auto;
    }
    .app-logo-block, .app-footer-block { display: none; }
    .app-nav { flex-direction: row; width: 100%; gap: 2px; }
    .app-nav-btn {
      flex: 1 1 0%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 2px;
      border-left: none !important;
      border-top: 2px solid transparent;
      text-align: center;
    }
    .app-nav-btn.active { border-top: 2px solid #E8A33D; }
    .app-nav-label { font-size: 10px; line-height: 1.1; }

    /* Right column needs bottom padding so content isn't hidden behind the fixed tab bar */
    .app-right-col { order: 1; padding-bottom: 64px; }

    /* Header: stack title and upload button, shrink upload button to icon-only */
    .app-header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px; }
    .app-header-actions { width: 100%; justify-content: flex-end; }
    .app-upload-label { display: none; }
    .app-upload-btn { padding: 8px 10px; }

    .app-content { padding: 14px; }

    /* Grids collapse to fewer columns */
    .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-cols-2 { grid-template-columns: repeat(1, minmax(0, 1fr)); }

    .max-w-6xl, .max-w-3xl { max-width: 100%; }
    .w-72, .w-56 { width: 100%; }
    .px-8 { padding-left: 14px; padding-right: 14px; }
  }

  @media (max-width: 420px) {
    .grid-cols-4 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .app-nav-label { display: none; }
  }
  input:focus, select:focus { outline: none; }

  #boot-error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;

<div id="boot-status">Loading territory panel…</div>
<div id="boot-error">
  <div id="boot-error-text">
    Couldn't load a required library — this dashboard needs an internet connection the first time<br/>
    it opens each session (it loads React and charting libraries from a CDN).<br/><br/>
    Check your connection and reload this file.
  </div>
</div>
<div id="root"></div>

<script>
  function showBootError(message) {
    document.getElementById('boot-status').style.display = 'none';
    var el = document.getElementById('boot-error');
    if (message) {
      document.getElementById('boot-error-text').innerHTML =
        'Something went wrong loading the dashboard:<br/><br/><span style="font-family:monospace;font-size:12px;color:#D9694B">' +
        message.replace(/</g, '&lt;') + '</span><br/><br/>Try reloading the page. If this keeps happening, it may be a browser extension or network policy blocking the page — try a different browser or network.';
    }
    el.style.display = 'flex';
  }

  // Catch any runtime error anywhere on the page (including inside the app script)
  // and show it instead of leaving the page stuck on "Loading..." with no explanation.
  window.addEventListener('error', function (e) {
    var loc = e.filename ? (' (' + e.filename.split('/').pop() + ':' + e.lineno + ')') : '';
    showBootError((e.message || String(e.error)) + loc);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError(e.reason ? (e.reason.message || String(e.reason)) : 'Unknown error');
  });

  // If a required library failed to load (e.g. no internet, or a CDN was blocked), say so.
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.React || !window.ReactDOM || !window.Recharts || !window.XLSX) {
        showBootError('A required script did not load (React, Recharts, or XLSX). This is usually a network or ad-blocker issue.');
      }
    }, 4000);
  });
</script>
